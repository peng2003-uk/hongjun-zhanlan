<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>雄关漫道真如铁 · 红小鬼的长征路</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Long+Cang&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <style>
        /* ===== 全局设计系统 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --red-deep: #6B1A1A;
            --red-mid: #8B2A2A;
            --red-accent: #B8433A;
            --red-light: #B22222;
            --gold: #C4A88A;
            --gold-light: #E6C9A8;
            --gold-dim: #A89070;
            --paper: #F5E6C8;
            --paper-dark: #E8DCCC;
            --paper-warm: #F0DDB8;
            --ink: #1A1A1A;
            --ink-light: #3D2B1F;
            --ink-dim: #5A4A3A;
            --bg-deep: #12100E;
            --bg-dark: #1E1A16;
            --shadow-card: 0 8px 32px rgba(107, 26, 26, 0.06), 0 2px 8px rgba(0,0,0,0.08);
            --shadow-card-hover: 0 16px 48px rgba(107, 26, 26, 0.10), 0 4px 12px rgba(0,0,0,0.12);
            --shadow-btn: 0 6px 24px rgba(139, 42, 42, 0.25);
            --shadow-btn-hover: 0 10px 36px rgba(139, 42, 42, 0.40);
            --radius: 24px;
            --radius-sm: 14px;
            --transition: 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            --transition-fast: 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            --font-title: 'Ma Shan Zheng', '华文行楷', cursive;
            --font-hand: 'Long Cang', '华文行楷', 'KaiTi', cursive;
            --font-text: 'Noto Serif SC', '宋体', 'Songti SC', serif;
        }

        #grain-overlay {
            position: fixed; inset: 0; z-index: 9998; pointer-events: none;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 256px 256px;
        }

        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-text);
            background: var(--bg-deep);
            color: var(--ink);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            cursor: none;
        }

        #custom-cursor {
            position: fixed; top: 0; left: 0; z-index: 10000;
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--red-accent);
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: width 0.15s ease, height 0.15s ease, background 0.25s ease, box-shadow 0.25s ease;
            box-shadow: 0 0 10px rgba(184,67,58,0.5);
        }
        #custom-cursor-follower {
            position: fixed; top: 0; left: 0; z-index: 9999;
            width: 36px; height: 36px; border-radius: 50%;
            border: 1.5px solid rgba(196,168,138,0.55);
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: transform 0.10s ease-out, width 0.25s ease, height 0.25s ease, border-color 0.25s ease, background 0.25s ease;
        }
        #custom-cursor-follower.hover {
            width: 56px; height: 56px;
            border-color: rgba(184,67,58,0.65);
            background: rgba(184,67,58,0.08);
            box-shadow: 0 0 28px rgba(184,67,58,0.20);
        }
        #custom-cursor-follower.hover-interactive {
            width: 64px; height: 64px;
            border-color: rgba(196,168,138,0.75);
            background: rgba(196,168,138,0.06);
            box-shadow: 0 0 32px rgba(196,168,138,0.22);
        }
        .scene-bg-2 #custom-cursor,
        .scene-bg-hero #custom-cursor,
        .scene-bg-4 #custom-cursor { background: #d4684a; box-shadow: 0 0 14px rgba(212,104,74,0.6); }
        .scene-bg-2 #custom-cursor-follower,
        .scene-bg-hero #custom-cursor-follower,
        .scene-bg-4 #custom-cursor-follower { border-color: rgba(220,180,150,0.50); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
        ::-webkit-scrollbar-thumb { background: var(--red-mid); border-radius: 4px; transition: width var(--transition-fast); }
        ::-webkit-scrollbar-thumb:hover { background: var(--red-accent); }

        #cover {
            position: fixed; inset: 0; z-index: 3000;
            display: none; align-items: center; justify-content: center;
            background: radial-gradient(ellipse at 30% 20%, #2a1212, #0d0808);
            flex-direction: column; overflow: hidden;
            cursor: default;
        }
        #cover.active { display: flex; cursor: default; }
        #cover.active ~ #custom-cursor,
        #cover.active ~ #custom-cursor-follower { display: none; }
        #starCanvas { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
        #cover .mountains { position: absolute; bottom: 0; left: 0; right: 0; z-index: 1; pointer-events: none; }
        #cover .mountain-layer {
            position: absolute; bottom: 0; left: -5%; right: -5%; height: 45%;
            transition: transform 0.1s linear;
        }
        #cover .mountain-layer.m1 {
            height: 30%; opacity: 0.38; filter: blur(1.6px);
            background: linear-gradient(180deg, transparent 0%, rgba(40,25,20,0.18) 50%, rgba(30,20,15,0.38) 100%);
            clip-path: polygon(0% 70%, 10% 50%, 20% 65%, 35% 35%, 50% 55%, 65% 30%, 80% 50%, 90% 40%, 100% 55%, 100% 100%, 0% 100%);
            z-index: 2;
        }
        #cover .mountain-layer.m2 {
            height: 38%; opacity: 0.70; filter: blur(0.4px);
            background: linear-gradient(180deg, transparent 0%, rgba(55,28,22,0.38) 40%, rgba(30,16,12,0.62) 100%);
            clip-path: polygon(0% 55%, 15% 30%, 25% 50%, 40% 25%, 55% 48%, 70% 20%, 80% 45%, 95% 30%, 100% 50%, 100% 100%, 0% 100%);
            z-index: 3;
        }
        #cover .mountain-layer.m3 {
            height: 45%; opacity: 1; filter: none;
            background: linear-gradient(180deg, transparent 0%, rgba(65,30,22,0.50) 45%, rgba(38,18,12,0.82) 100%);
            clip-path: polygon(0% 40%, 12% 25%, 28% 45%, 42% 20%, 58% 40%, 72% 28%, 85% 42%, 100% 30%, 100% 100%, 0% 100%);
            z-index: 4;
        }
        #cover .poster {
            position: relative; z-index: 5;
            max-width: 680px; width: 100%;
            padding: 44px 36px 40px;
            background: linear-gradient(145deg, rgba(30,20,16,0.85), rgba(18,12,10,0.92));
            backdrop-filter: blur(20px);
            border-radius: 32px;
            border: 1px solid rgba(184,67,58,0.25);
            box-shadow: 0 40px 80px rgba(0,0,0,0.85), inset 0 1px 0 rgba(230,201,168,0.06), inset 0 0 40px rgba(107,26,26,0.03);
            text-align: center;
            margin: 20px;
            animation: floatPoster 4s ease-in-out infinite;
            transition: transform var(--transition);
        }
        @keyframes floatPoster { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        #cover .poster .star { font-size: 3rem; color: var(--red-accent); text-shadow: 0 0 60px rgba(184,67,58,0.4); display: block; margin-bottom: 4px; }
        #cover .poster .year { font-size: 0.75rem; color: var(--gold-dim); letter-spacing: 8px; margin-bottom: 12px; font-weight: 300; }
        #cover .poster .main-title { font-family: var(--font-title); font-size: clamp(2.8rem, 7vw, 4.6rem); color: var(--gold-light); letter-spacing: 10px; text-shadow: 0 4px 40px rgba(0,0,0,0.6); line-height: 1.15; }
        #cover .poster .main-title .red { color: var(--red-accent); font-size: 0.7em; letter-spacing: 6px; }
        #cover .poster .sub-title { font-size: clamp(0.9rem, 1.8vw, 1.2rem); color: var(--gold); letter-spacing: 8px; margin: 8px 0 14px; font-weight: 300; }
        #cover .poster .divider-line { width: 100px; height: 2px; margin: 14px auto 18px; background: linear-gradient(90deg, transparent, var(--red-accent), transparent); border-radius: 4px; }
        #cover .poster .desc { font-size: 0.85rem; color: #8a7a6a; letter-spacing: 3px; line-height: 1.9; max-width: 420px; margin: 0 auto 24px; font-weight: 300; }
        #cover .poster .btn-enter {
            background: var(--red-mid); border: none; color: #fff;
            font-family: var(--font-text); font-size: 0.95rem;
            padding: 15px 48px; border-radius: 60px;
            cursor: pointer; transition: var(--transition);
            box-shadow: var(--shadow-btn);
            letter-spacing: 4px; font-weight: 600;
            position: relative; overflow: hidden;
        }
        #cover .poster .btn-enter:hover { background: var(--red-deep); transform: scale(1.05); box-shadow: var(--shadow-btn-hover); }
        #cover .poster .btn-enter .arrow { display: inline-block; margin-left: 8px; transition: var(--transition); }
        #cover .poster .btn-enter:hover .arrow { transform: translateX(8px); }
        #cover .poster .btn-enter .pulse-ring {
            position: absolute; inset: -4px; border-radius: 64px;
            border: 2px solid rgba(184,67,58,0.25);
            animation: pulseRing 2.4s ease-out infinite;
            pointer-events: none;
        }
        @keyframes pulseRing { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.12); opacity: 0; } }
        #cover .poster .footer-note { margin-top: 20px; font-size: 0.62rem; color: var(--ink-dim); letter-spacing: 4px; }
        #cover .poster .footer-note strong { color: var(--gold-dim); }

        #app { display: none; height: 100vh; width: 100vw; overflow: hidden; background: var(--paper); }
        #app.visible { display: flex; }

        #mapNav {
            width: 160px; min-width: 160px; height: 100vh;
            background: linear-gradient(180deg, #161210 0%, #1e1a16 100%);
            padding: 60px 0 30px 0; overflow-y: auto; overflow-x: hidden;
            border-right: 1px solid rgba(139,42,42,0.12);
            flex-shrink: 0; z-index: 100;
        }
        #mapNav::-webkit-scrollbar { width: 2px; }
        #mapNav::-webkit-scrollbar-thumb { background: var(--red-mid); border-radius: 2px; }
        #mapNav .map-title { text-align: center; color: var(--gold-light); font-family: var(--font-title); font-size: 0.9rem; letter-spacing: 4px; padding: 0 10px 16px; border-bottom: 1px solid rgba(139,42,42,0.12); margin: 0 12px 16px; }
        #mapNav .map-title span { display: block; font-size: 0.55rem; font-family: var(--font-text); color: var(--ink-dim); letter-spacing: 3px; font-weight: 300; margin-top: 2px; }
        #mapNav .map-svg-wrap { padding: 0 12px; display: flex; justify-content: center; }
        #mapNav .map-svg-wrap svg { width: 100%; height: auto; max-height: calc(100vh - 160px); }

        .map-node { cursor: pointer; transition: all var(--transition-fast); }
        .map-node circle { transition: all var(--transition-fast); fill: #2a1a10; stroke: #5a4a3a; stroke-width: 2; filter: drop-shadow(0 0 2px rgba(0,0,0,0.3)); }
        .map-node .badge-ring { fill: none; stroke: rgba(196,168,138,0.18); stroke-width: 3; transition: all var(--transition-fast); }
        .map-node text { fill: #7a6a5a; font-size: 7px; font-family: var(--font-text); letter-spacing: 0.5px; dominant-baseline: central; text-anchor: middle; pointer-events: none; transition: all var(--transition-fast); }
        .map-node:hover circle { fill: #5a3a2a; stroke: var(--gold); stroke-width: 2.5; r: 6; }
        .map-node:hover .badge-ring { stroke: rgba(196,168,138,0.40); r: 9; }
        .map-node:hover text { fill: var(--gold-light); }
        .map-node.active circle { fill: var(--red-accent); stroke: var(--gold); stroke-width: 3; r: 7; filter: drop-shadow(0 0 18px rgba(184,67,58,0.7)) drop-shadow(0 0 6px rgba(196,168,138,0.4)); }
        .map-node.active text { fill: var(--gold-light); }
        .map-node.active .badge-ring { stroke: rgba(196,168,138,0.55); stroke-width: 3; r: 11; animation: badgePulse 2s ease-in-out infinite; }
        @keyframes badgePulse { 0%,100% { stroke-opacity: 0.55; r: 11; } 50% { stroke-opacity: 0.80; r: 12.5; } }
        .map-node.visited circle { fill: #5a3a2a; stroke: #8a6a4a; }
        .map-node.visited text { fill: #9a8a7a; }
        .map-terrain { stroke: #2a2218; stroke-width: 1; fill: none; stroke-dasharray: 2 6; opacity: 0.4; }
        .map-tooltip { position: absolute; z-index: 200; background: rgba(20,14,10,0.94); color: var(--gold-light); font-family: var(--font-text); font-size: 0.65rem; padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(184,67,58,0.3); pointer-events: none; white-space: nowrap; letter-spacing: 1px; display: none; box-shadow: 0 4px 16px rgba(0,0,0,0.6); }
        .map-path { stroke: #3a2a1a; stroke-width: 2; fill: none; stroke-dasharray: 4 4; }
        .map-path.done { stroke: var(--red-accent); stroke-dasharray: var(--path-len); stroke-dashoffset: 0; opacity: 0.7; animation: drawPath 1.2s cubic-bezier(0.23, 1, 0.32, 1) forwards; }
        @keyframes drawPath { from { stroke-dashoffset: var(--path-len); } to { stroke-dashoffset: 0; } }

        #content { flex: 1; height: 100vh; overflow-y: auto; overflow-x: hidden; background: var(--paper); padding: 0; position: relative; scroll-behavior: smooth; transition: background-color 0.8s cubic-bezier(0.23, 1, 0.32, 1); }
        #content::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 30%, transparent 40%, rgba(0,0,0,0.06) 100%); transition: opacity 0.8s ease; }
        #content.theme-scene-1::before { display: none; }

        /* ===== 第二单元导语页 - 暗红底层背景 + 黑色人物剪影 ===== */
        .intro-silhouettes-wrap {
            position: absolute; inset: 0; z-index: 0; pointer-events: none;
            overflow: hidden;
        }
        .intro-sil-img {
            position: absolute; bottom: 0;
            filter: brightness(0);
            opacity: 0.22;
            transition: opacity 0.8s ease;
        }
        .intro-sil-bugler { left: 2%; height: 68%; bottom: 3%; }
        .intro-sil-soldier { right: 14%; height: 60%; bottom: 2%; }
        .intro-sil-propagandist { right: 0; height: 55%; bottom: 4%; }
        /* 第二单元导语页文本框收窄，让两侧人物剪影露出 */
        #sceneContainer.intro-unit2-mode { max-width: 620px !important; }
        #content.theme-scene-3::before { background: radial-gradient(ellipse at 50% 25%, rgba(220,200,160,0.04) 0%, transparent 35%, rgba(0,0,0,0.22) 100%); }
        #content.theme-scene-epilogue::before { background: radial-gradient(ellipse at 50% 25%, rgba(200,160,120,0.03) 0%, transparent 30%, rgba(0,0,0,0.25) 100%); }
        #content::-webkit-scrollbar { width: 6px; }
        #content::-webkit-scrollbar-thumb { background: var(--red-mid); border-radius: 4px; }
        #content::-webkit-scrollbar-thumb:hover { background: var(--red-accent); }

        #topBar { position: sticky; top: 0; z-index: 50; background: rgba(245,230,200,0.80); backdrop-filter: blur(16px) saturate(110%); -webkit-backdrop-filter: blur(16px) saturate(110%); padding: 8px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(139,42,42,0.06); min-height: 48px; transition: background 0.8s cubic-bezier(0.23,1,0.32,1), border-color 0.8s cubic-bezier(0.23,1,0.32,1), color 0.8s cubic-bezier(0.23,1,0.32,1); }
        .scene-bg-hero #topBar { background: rgba(20,16,12,0.88); backdrop-filter: blur(16px); border-bottom-color: rgba(139,42,42,0.15); color: var(--gold-light); }
        .scene-bg-hero #topBar .brand { color: var(--gold-light); }
        .scene-bg-hero #topBar .unit-indicator { color: var(--gold-dim); }
        .scene-bg-2 #topBar { background: rgba(28,14,10,0.88); backdrop-filter: blur(16px); border-bottom-color: rgba(139,42,42,0.14); color: #f0e0d0; }
        .scene-bg-2 #topBar .brand { color: #f0e0d0; }
        .scene-bg-2 #topBar .unit-indicator { color: var(--gold-dim); }
        .scene-bg-4 #topBar { background: rgba(18,28,16,0.88); backdrop-filter: blur(16px); border-bottom-color: rgba(140,170,120,0.10); color: #e8e0d0; }
        .scene-bg-4 #topBar .brand { color: #e8e0d0; }
        .scene-bg-4 #topBar .unit-indicator { color: var(--gold-dim); }
        .scene-bg-epilogue #topBar { background: rgba(20,16,14,0.88); backdrop-filter: blur(16px); border-bottom-color: rgba(184,67,58,0.10); color: #e8ddd0; }
        .scene-bg-epilogue #topBar .brand { color: var(--gold-light); }
        .scene-bg-epilogue #topBar .unit-indicator { color: var(--gold-dim); }
        #topBar .brand { font-family: var(--font-title); font-size: 1rem; color: var(--ink); letter-spacing: 3px; }
        #topBar .brand .red { color: var(--red-accent); }
        #topBar .unit-indicator { font-size: 0.75rem; color: var(--ink-light); opacity: 0.6; letter-spacing: 1px; }
        #topBar .unit-indicator strong { color: var(--red-accent); opacity: 1; font-weight: 600; }
        #topBar .nav-controls { display: flex; gap: 8px; }
        #topBar .nav-controls button { background: transparent; border: 1px solid rgba(139,42,42,0.12); color: var(--ink-light); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; transition: var(--transition-fast); font-size: 0.9rem; display: flex; align-items: center; justify-content: center; font-family: var(--font-text); }
        #topBar .nav-controls button:hover { background: var(--red-mid); color: #fff; border-color: var(--red-mid); }

        .scene-card-stamp { position: absolute; top: 18px; right: 22px; z-index: 10; width: 56px; height: 56px; border: 2px solid rgba(180,40,30,0.55); border-radius: 6px; display: flex; align-items: center; justify-content: center; transform: rotate(12deg); opacity: 0.28; pointer-events: none; font-family: var(--font-title); font-size: 14px; color: rgba(180,40,30,0.55); letter-spacing: 2px; line-height: 1.1; text-align: center; writing-mode: vertical-rl; box-shadow: 0 0 8px rgba(180,40,30,0.12); transition: opacity 0.5s, transform 0.5s; }
        .scene-card-stamp::after { content: ''; position: absolute; inset: 3px; border: 1px solid rgba(180,40,30,0.40); border-radius: 4px; pointer-events: none; }
        .theme-scene-1 .scene-card-stamp { border-color: rgba(220,100,70,0.45); color: rgba(220,100,70,0.45); }
        .theme-scene-1 .scene-card-stamp::after { border-color: rgba(220,100,70,0.30); }
        .theme-scene-3 .scene-card-stamp { border-color: rgba(180,200,190,0.35); color: rgba(180,200,190,0.45); }
        .theme-scene-3 .scene-card-stamp::after { border-color: rgba(180,200,190,0.25); }
        .theme-scene-4 .scene-card-stamp { border-color: rgba(30,30,30,0.50); color: rgba(30,30,30,0.50); border-radius: 0; }
        .theme-scene-4 .scene-card-stamp::after { border-color: rgba(30,30,30,0.35); border-radius: 0; }

        .year-watermark { position: absolute; pointer-events: none; z-index: 0; font-family: 'Georgia', 'Times New Roman', serif; font-size: clamp(6rem, 16vw, 14rem); font-weight: 900; opacity: 0.025; letter-spacing: -0.02em; white-space: nowrap; user-select: none; }
        .year-watermark.wm-bottom-right { bottom: -20px; right: -10px; }
        .year-watermark.wm-top-left { top: -10px; left: -10px; }
        .theme-scene-0 .year-watermark { color: #3a2010; }
        .theme-scene-1 .year-watermark { color: #D0A090; opacity: 0.03; }
        .theme-scene-2 .year-watermark { color: #4a3020; }
        .theme-scene-3 .year-watermark { color: #C8D8C0; opacity: 0.03; }
        .theme-scene-4 .year-watermark { color: #1a1a1a; opacity: 0.04; }
        .theme-scene-epilogue .year-watermark { color: #C0A080; opacity: 0.025; }

        .scene-header h3 { font-family: var(--font-title); font-size: clamp(1.5rem, 3vw, 2.2rem); letter-spacing: 5px; margin: 6px 0 4px; position: relative; display: inline-block; padding-bottom: 8px; background: linear-gradient(180deg, transparent 65%, rgba(184,67,58,0.10) 65%, rgba(184,67,58,0.18) 100%); -webkit-background-clip: text; background-clip: text; }
        .theme-scene-2 .scene-header h3 { background: linear-gradient(180deg, transparent 65%, rgba(107,26,26,0.14) 65%, rgba(107,26,26,0.25) 100%); -webkit-background-clip: text; background-clip: text; }
        .theme-scene-4 .scene-header h3 { background: linear-gradient(180deg, transparent 65%, rgba(30,30,30,0.12) 65%, rgba(30,30,30,0.22) 100%); -webkit-background-clip: text; background-clip: text; }

        #sceneContainer { padding: 0 24px 60px; max-width: 860px; margin: 0 auto; position: relative; z-index: 2; }

        .scene-card { background: rgba(255,248,235,0.68); backdrop-filter: blur(25px) saturate(120%); -webkit-backdrop-filter: blur(25px) saturate(120%); border-radius: var(--radius); padding: 40px 42px 44px; box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset, 0 4px 24px rgba(60,30,15,0.06), 0 12px 48px rgba(60,30,15,0.04), 0 24px 80px rgba(60,30,15,0.03); border: 1px solid rgba(255,255,255,0.45); margin: 24px 0 34px; animation: fadeIn 0.6s ease forwards; position: relative; z-index: 2; overflow: hidden; transition: box-shadow var(--transition), border-color var(--transition), background var(--transition); }
        .scene-card:hover { box-shadow: 0 1px 0 rgba(255,255,255,0.55) inset, 0 6px 32px rgba(80,40,20,0.10), 0 18px 56px rgba(80,40,20,0.07), 0 32px 96px rgba(80,40,20,0.05); }
        @keyframes fadeIn { 0%{opacity:0;transform:translateY(20px)} 100%{opacity:1;transform:translateY(0)} }
        @keyframes slideInRight { 0%{opacity:0;transform:translateX(40px)} 100%{opacity:1;transform:translateX(0)} }
        @keyframes slideInLeft { 0%{opacity:0;transform:translateX(-40px)} 100%{opacity:1;transform:translateX(0)} }

        .theme-scene-1 #sceneContainer { max-width: 100%; padding: 0; transition: max-width var(--transition), padding var(--transition); }

        #content.theme-scene-1 { background: linear-gradient(175deg, #3D0C0C 0%, #5C1414 25%, #6B1818 50%, #4E1010 75%, #2E0808 100%) !important; }

        .xiangjiang-theater .theater-bg-silhouette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;

            opacity: 0.85;

            content: '';

            background: radial-gradient(ellipse at 50% 35%, rgba(240, 80, 50, 0.06) 0%, rgba(200, 50, 30, 0.10) 40%, rgba(140, 20, 10, 0.18) 75%, rgba(80, 10, 5, 0.28) 100%);

    <script>
    (function() {
    'use strict';

    const starCanvas = document.getElementById('starCanvas');
    if (starCanvas) {
        const ctx = starCanvas.getContext('2d');
        let stars = [];
        const STAR_COUNT = 80;
        const coverEl = document.getElementById('cover');
        function resizeCanvas() { starCanvas.width = window.innerWidth; starCanvas.height = window.innerHeight; }
        resizeCanvas(); window.addEventListener('resize', resizeCanvas);
        function initStars() {
            stars = [];
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push({ x: Math.random() * starCanvas.width, y: Math.random() * starCanvas.height, r: Math.random() * 1.6 + 0.4, twinkleSpeed: Math.random() * 0.008 + 0.003, twinkleOffset: Math.random() * Math.PI * 2, driftX: (Math.random() - 0.5) * 0.15, driftY: (Math.random() - 0.5) * 0.08 });
            }
        }
        initStars(); window.addEventListener('resize', () => { resizeCanvas(); initStars(); });
        let frame = 0;
        function animateStars() {
            if (!coverEl.classList.contains('active')) { requestAnimationFrame(animateStars); return; }
            ctx.clearRect(0, 0, starCanvas.width, starCanvas.height); frame++;
            stars.forEach(s => { s.x += s.driftX; s.y += s.driftY; if (s.x < 0) s.x = starCanvas.width; if (s.x > starCanvas.width) s.x = 0; if (s.y < 0) s.y = starCanvas.height; if (s.y > starCanvas.height) s.y = 0; const alpha = 0.25 + 0.2 * Math.sin(frame * s.twinkleSpeed + s.twinkleOffset); ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fillStyle = `rgba(255,215,150,${alpha})`; ctx.fill(); });
            requestAnimationFrame(animateStars);
        }
        animateStars();
        const mountainLayers = document.querySelectorAll('.mountain-layer');
        coverEl.addEventListener('mousemove', function(e) { const cx = e.clientX / window.innerWidth - 0.5; const cy = e.clientY / window.innerHeight - 0.5; if (mountainLayers[0]) mountainLayers[0].style.transform = `translateX(${cx*12}px) translateY(${cy*6}px)`; if (mountainLayers[1]) mountainLayers[1].style.transform = `translateX(${cx*20}px) translateY(${cy*10}px)`; if (mountainLayers[2]) mountainLayers[2].style.transform = `translateX(${cx*30}px) translateY(${cy*14}px)`; });
        coverEl.addEventListener('mouseleave', function() { mountainLayers.forEach(l => l.style.transform = 'translateX(0) translateY(0)'); });
    }

    (function initCursor() {
        const dot = document.getElementById('custom-cursor'), ring = document.getElementById('custom-cursor-follower');
        if (!dot || !ring) return;
        let mx = window.innerWidth / 2, my = window.innerHeight / 2, rx = mx, ry = my;
        document.addEventListener('mousemove', function(e) { mx = e.clientX; my = e.clientY; dot.style.left = mx + 'px'; dot.style.top = my + 'px'; });
        function animate() { rx += (mx - rx) * 0.28; ry += (my - ry) * 0.28; ring.style.left = rx + 'px'; ring.style.top = ry + 'px'; requestAnimationFrame(animate); }
        animate();
        const hoverSel = '.map-node, .btn-next, .btn-enter, button, .art-item, .continue-hint, #enterBtn, #prevBtn, #nextBtn, .scene-card';
        document.addEventListener('mouseover', function(e) { const t = e.target.closest(hoverSel); if (t) { ring.classList.add('hover'); if (t.closest('.map-node') || t.closest('.art-item')) ring.classList.add('hover-interactive'); } });
        document.addEventListener('mouseout', function(e) { const t = e.target.closest(hoverSel); if (t) ring.classList.remove('hover', 'hover-interactive'); });
    })();

    const rawScenes = [
    { id:'hero', type:'hero', unit:'序厅', title:'雄关漫道真如铁', subtitle:'一个"红小鬼"的长征路', bg:'scene-bg-hero', nodeIndex:0, blocks:[{type:'narr',text:'策展缘由\n"为有牺牲多壮志，敢教日月换新天"。长征是人类历史上的伟大奇迹。今年是中国红军长征胜利90周年，为了纪念红军长征并让观众了解长征路上的艰苦岁月，感悟先辈们的牺牲和奉献，特此推出长征文化展。'},{type:'narr',text:'展览前言\n1934年10月，中共中央和中革军委率中央红军主力从江西于都出发，开始战略转移。至1936年10月三大主力会师，历时两年，途经十余省，翻越雪山，穿过草地，进行重要战役战斗六百余次，总行程约二万五千里。史称长征。'},{type:'narr',text:'长征队伍中包含一定数量的少年战士，年龄多在8至16岁之间，通常被称为"红小鬼"。据不完全统计，仅中央红军中就有约一万余名。本展览以虚构人物"赵小二"为叙述者，其经历综合自长征亲历者的口述史、回忆录及档案记载，是红小鬼群体共同记忆的凝结。'}], guide:'一个十三岁的孤儿，死缠烂打加入了红军。他还不懂什么是革命，只知道——红军给了他一个家。', nextRaw:'unit1_intro' },
    { id:'unit1_intro', type:'intro', unit:'第一单元', title:'倔强 · 初入红军', bg:'scene-bg-1', nodeIndex:0, introText:'1933年9月，国民党调集重兵对中央苏区发动第五次大规模"围剿"，依靠碉堡封锁与经济围困，逐步压缩根据地范围。受"左"倾错误军事指挥影响，中央红军放弃灵活战术，与强敌开展阵地消耗战，苦战一年后反"围剿"最终失利。\n1934年上半年，中央苏区多处重要防线失守，内外形势日趋严峻。为保存革命有生力量，中共中央决定实施战略转移，并选定地理与敌情条件相对有利的江西于都作为集结出发地。1934年10月，八万余名中央红军主力将士齐聚于都，筹备撤离中央苏区，举世闻名的长征由此启程。\n当大部队要从瑞金转移到于都、准备离开根据地时，十三岁的孤儿赵小二不愿再重回流浪生活，几番坚持后如愿加入红军，被分配为小号手学徒。这名倔强的红小鬼，从此与数万红军战士一道，走进了艰苦卓绝的烽火征程。', guide:'一个孤儿，一把军号，一段改变命运的征途。', nextRaw:'unit1_1' },
    { id:'unit1_1', type:'scene', unit:'第一单元 · 倔强', title:'我叫赵小二', number:'场景 1 / 3', bg:'scene-bg-1', nodeIndex:0, blocks:[{type:'narr',speaker:'赵小二',text:'我叫赵小二，生长在赣南的乡村。黑暗的年月里，苦难早早找上了我。父亲参加农会投身革命，被国民党靖卫团残忍杀害；母亲积劳成疾，没钱医治，最终也撒手离去。短短时间，我成了无依无靠的孤儿。'},{type:'narr',text:'往后的日子，我只能靠放牛、沿街乞讨谋生，常年食不果腹、颠沛流离。直到红军进驻苏区，废除了压在百姓身上的苛捐杂税，穷苦人终于有了活路。在这里，我第一次吃上热腾腾的饱饭，不再看人脸色过日子。'},{type:'narr',text:'那时的我年纪尚小，听不懂高深的革命道理，心里只有最简单的想法：红军收留了我，给了我温暖和温饱，这里就是我的家。',highlight:true}], archives:[{title:'历史档案：长征前夕的赣南苏区',text:'土地革命战争时期，赣南是中央革命根据地的核心区域。国民党当局对苏区轮番开展军事"围剿"，实行全方位经济封锁，同时大肆征收苛捐杂税，当地底层民众在战乱与盘剥中艰难度日。\n红军抵达赣南并建立苏维埃政权后，大力开展土地革命，将土地分给贫苦农民，彻底废除各类苛捐杂税。苏区政府设立专门机构与群众团体，对孤寡、流浪孤儿等困难群体开展常态化救助。',artifacts:[{img:'https://picsum.photos/seed/soviet1/200/150',desc:'苏区户籍门牌'},{img:'https://picsum.photos/seed/decree1/200/150',desc:'苏维埃法令'},{img:'https://picsum.photos/seed/burn1/200/150',desc:'烧地契'}]}], guide:'他还不懂什么是革命，但他知道——红军给了他活下去的勇气。', nextRaw:'unit1_2' },
    { id:'unit1_2', type:'scene', unit:'第一单元 · 倔强', title:'死缠烂打，我要当兵', number:'场景 2 / 3', bg:'scene-bg-1', nodeIndex:0, blocks:[{type:'narr',speaker:'赵小二',text:'当大部队要从瑞金转移到于都、准备离开根据地时，我执意要参军，哪怕因为年纪太小被干部拒绝了无数次，我也死死拽着队伍不撒手。终于在我的软磨硬泡之下，连队收了我。'},{type:'narr',text:'那天的我特别开心，感觉当上红军神气得很。我刚开始想当小号手，没想到连长真的安排我跟老号手学吹号。我胸前吊着一把沉甸甸的黄铜军号，虽然还吹不全号谱，可连长说："有这心气，早晚是块料。"',highlight:true}], archives:[{title:'历史档案：中央红军于都集结与司号兵',text:'1934年10月上旬，中央红军主力各部陆续集结于江西于都河畔，总计八万六千余名指战员在此休整、整编，为战略转移做最后的准备。\n红军司号手是连队重要岗位，军号是当年军队的"通讯工具"，不同号谱对应集合、行军、冲锋、收兵等指令。红军中不少司号手都是年纪尚小的少年战士。',artifacts:[{img:'https://picsum.photos/seed/trumpet1/200/150',desc:'黄铜军号'},{img:'https://picsum.photos/seed/leave1/200/150',desc:'离开苏区'},{img:'https://picsum.photos/seed/sweater1/200/150',desc:'何叔衡赠林伯渠的毛衣'}]}], guide:'一把军号，一腔热血。红小鬼的征途，从这一刻开始。', nextRaw:'unit1_3' },
    { id:'unit1_3', type:'scene', unit:'第一单元 · 倔强', title:'第一堂纪律课', number:'场景 3 / 3', bg:'scene-bg-1', nodeIndex:0, blocks:[{type:'narr',speaker:'赵小二',text:'队伍正式出发的深夜，于都下起了冰冷的秋雨。雨点砸在脸上，又冷又疼。八万多人的队伍踏着泥泞前行，黑暗里满是脚步与骡马的声响。'},{type:'narr',text:'连续几十里的急行军，远远超出了我的承受能力。脚上的草鞋很快磨烂，脚底密密麻麻长满血泡，每走一步都钻心地疼。我再也撑不住，瘫坐在路边抹起眼泪，心里又累又委屈。'},{type:'narr',text:'一只布满老茧的手敲了敲我的脑袋，是十九岁的连长陈小石头。他十三岁便参军入伍，身经百战，是队伍里人人敬重的"老革命"。他没有柔声安慰，拿出烧红的缝衣针，狠心帮我挑破血泡，又仔细为我扎紧绑腿。'},{type:'dialogue',speaker:'陈小石头',text:'"哭解决不了任何问题，更打不退敌人。军号就是全连的耳朵，号手一旦掉队，整个连队都会陷入危险。红军的纪律是队伍的根基，身为战士，眼泪要藏在心里，脚步绝不能停下，掉队就意味着死亡。"'},{type:'narr',text:'我攥紧胸前的军号，硬生生把泪水咽了回去。这一刻我猛然明白：我不再是随性撒娇的流浪孩童，而是一名真正的红军战士。',highlight:true}], archives:[{title:'红军中的"Ta"们 —— 少年"老革命"',text:'红军队伍里的"老革命"，并非指代年长战士，而是战友们对参军时间早、作战经验丰富、意志坚定的年轻指战员的尊称。\n中央红军整体队伍十分年轻，长征出发时大量基层官兵十余岁便投身革命。他们大多成长于中央苏区，早年加入儿童团、少先队，随后正式入伍，全程参与了数次反"围剿"战斗。数年的战火磨砺，让他们虽然年纪尚轻，却早已具备成熟的军人素养与实战能力。',artifacts:[{img:'https://picsum.photos/seed/discipline1/200/150',desc:'红军纪律条令草案'},{img:'https://picsum.photos/seed/note1/200/150',desc:'长征补偿字条'},{img:'https://picsum.photos/seed/young1/200/150',desc:'少共国际师袖章'}]}], guide:'告别赣南，赵小二踏上了未知的征途。前方，是血与火的考验。', nextRaw:'unit2_intro' },
    { id:'unit2_intro', type:'intro', unit:'第二单元', title:'惶恐 · 血火挣扎', bg:'scene-bg-2', nodeIndex:1, introText:'1934年11月下旬，中央红军在湘江与国民党军展开殊死决战，惨烈的战斗造成大量伤亡。突围之后，红军连夜翻越老山界，向贵州境内的乌江行进。\n少年赵小二在湘江战场不幸掉队，被女战士营救后重新踏上征途。连日的浴血奋战与长途跋涉让他心生迷茫，直至抵达乌江岸边，他跟随宣传队员学习文化、理解革命意义，在血与火的历练中悄然成长。', guide:'湘江的血水，冲走了无数战友。但赵小二，活了下来。', nextRaw:'unit2_1' },
    { id:'unit2_1', type:'scene', unit:'第二单元 · 惶恐', title:'湘江！血肉绞肉机', number:'场景 1 / 4', bg:'scene-bg-2', nodeIndex:1, heroImage:'images/血战湘江ai图片.png', imageCaption:{title:'湘江战役 · 历史影像',text:'1934年11月27日至12月1日，中央红军在湘江上游广西境内与国民党军苦战五昼夜，强渡湘江，突破了国民党军的第四道封锁线。此役是中央红军长征中牺牲最为惨重的一战，出发时8.6万余人的队伍，渡过湘江后锐减至3万余人。'}, theaterData:{stampText:'生死湘江',diaryTitle:'战地日记 · 十四岁的冲锋',theaterClass:'xiangjiang-theater', diaryText:'在突破第四道封锁线的湘江战役中，年仅14岁的红小鬼赵小二紧紧跟随着主力部队的步伐。天空中，国民党军的飞机轰鸣着俯冲而下，投下的炸弹在清澈的江水中炸开一道道巨大的水柱，江水瞬间被战士们的鲜血染得通红。面对密集的弹雨和摇晃剧烈的浮桥，赵小二心中没有恐惧，只有一定要冲过去的坚定信念。他亲眼看见身边的战友一个个倒下，但冲锋的号角依然在耳边激荡。他冒着迎面扑来的滚滚浓烟，紧握着手中的钢枪，不顾一切地向前奔跑，年轻的脸庞上写满了超越年龄的坚毅与不怕牺牲的勇敢。',boardTitle:'历史档案 · 湘江战役',theaterClass:'xiangjiang-theater', balladText:'三年不饮湘江水，十年不食湘江鱼', boardText:'湘江战役是红军长征出发以来最壮烈的一战。红军将士在浴血奋战中，以巨大的牺牲突破了国民党军精心构筑的第四道封锁线，粉碎了敌人围歼红军于湘江以东的企图。战役中，国民党军调集重兵，并在飞机的疯狂轰炸下，对正渡江的红军发起猛烈进攻。江水被鲜血染红，红五军团三十四师师长陈树湘率领部队绝境断后，苏醒后断肠牺牲。红一军团二师五团政委易荡平也在此役中壮烈牺牲。',layers:{bgScroll:'images/血战湘江.jpg',polaroid:{src:'images/血战湘江.jpg',caption:'《湘江突围》· 艺术还原'},chen:{src:'images/湘江战役陈树湘.jpg',caption:'师长陈树湘 · 绝境断后'},artifact:{src:'images/易荡平的蓑衣.png',label:'一级文物：易荡平的蓑衣',sublabel:'红一军团二师五团政委 · 湘江战役遗物',museum:'Museum Exhibit Archive'}}}, blocks:[{type:'narr',speaker:'赵小二',text:'那根本不是人间，那是血肉绞肉机。'},{type:'narr',text:'1934年11月底，我们连队奉命在江岸阻击敌人。国民党的道格拉斯飞机在头顶发出刺耳的尖叫，一发发航空炸弹砸进湘江，掀起十几米高的血浪。江面上漂浮着密密麻麻的灰色军装。连长满脸是血，对着我怒吼：'},{type:'dialogue',speaker:'连长',text:'"小二！吹冲锋号！吹！"'},{type:'narr',text:'我抖索着双手，把冰冷的号嘴凑到嘴边，可还没等我吐出第一个音符，一发巨大的航空炸弹就在身边轰然炸响。恐怖的气浪瞬间将我打翻，狠狠砸进了一个满是残肢断臂的烂泥坑里。眼前的世界陷入了一片血红与黑暗。'},{type:'narr',text:'不知过了多久，当我满身血泥地从死人堆里爬出来时，大部队已经渡江，白匪的侧击部队正在打扫战场、枪杀重伤员。我彻底跟大部队走散了。我紧紧抱着那把残存的黄铜军号，在硝烟弥漫的树林里疯狂逃窜。'}], archives:[{title:'历史档案：血战湘江 —— 长征最惨烈的一战',text:'1934年11月下旬至12月初，中央红军在广西境内打响湘江战役，这是红军长征途中突破国民党军第四道封锁线的关键战斗，也是人民军队战史上牺牲最为惨重的战役之一。蒋介石调集30余万兵力，依托湘江天险构筑封锁线，企图将八万余红军围歼于湘江东岸。\n经过数日浴血拼杀，中央红军成功突破封锁线，但付出了巨大代价：长征出发时8.6万余人的队伍，渡过湘江后锐减至3万余人。担负后卫阻击任务的红五军团第三十四师、红三军团第十八团被敌军截断在湘江东岸，大部壮烈牺牲，红三十四师师长陈树湘被俘后宁死不屈，断肠殉国。',artifacts:[{img:'https://picsum.photos/seed/xiang1/200/150',desc:'易荡平穿过的蓑衣'},{img:'https://picsum.photos/seed/xiang2/200/150',desc:'陈树湘，断肠殉国'},{img:'https://picsum.photos/seed/xiang3/200/150',desc:'血战湘江战场'}]}], guide:'湘江的血水，冲走了无数战友。但赵小二，活了下来。', nextRaw:'unit2_2' },
    { id:'unit2_2', type:'scene', unit:'第二单元 · 惶恐', title:'汉阳造与女战士', number:'场景 2 / 4', bg:'scene-bg-2', nodeIndex:1, blocks:[{type:'narr',speaker:'赵小二',text:'就在一个白匪端着刺刀狞笑着朝我刺来时，"砰"的一声沉闷枪响，白匪应声倒地。一把热烫的步枪挡在我的面前，那是负责掩护大部队、在后方打阻击的女战士李桂英，大家都管她叫"汉阳造"。'},{type:'narr',text:'她身形挺拔，手里紧紧攥着一杆打得烫手的汉阳造步枪。她出身工人家庭，12岁遭恶霸欺辱，16岁时心爱的丈夫被资本家迫害惨死，18岁父亲被厂主逼死。她是带着父亲临终前"必须拥有一把自己的枪，不再任人宰割"的遗言参加红军的。'},{type:'narr',text:'我抓着她满是黑灰的衣角哭喊，诉说自己和连队失散的遭遇。李桂英一把拉开枪栓，在敌机轰炸中将我死死护在身下。她告诉我，害怕是人之常情，但红军的勇敢，是哪怕心生畏惧，也要坚守责任。'},{type:'narr',text:'她带着我在枪林弹雨里边打边撤，一发子弹击穿了她的肩膀，她依旧持枪迎敌。看着她流淌的热血，我内心的懦弱渐渐消散，紧紧抱着军号，跟随她一同寻找大部队的踪迹。'}], theaterData:{buttonText:'接过汉阳造 · 继续踏上征途', theaterClass:'nvyong-theater', boardTitle:'红军中的她们 · 中央红军长征女战士', boardText:'1934年10月中央红军实施战略转移前夕，中共中央经筛选拟定32名随军女同志名单，最终2人因身体原因留守中央苏区，共计30名女战士随主力从江西于都出发长征。该群体初期统一组建妇女队，由刘群先担任队长，金维映担任政治委员。\n湘江战役中，后方附属人员需承担阵地警戒、伤员转运、失散人员收容等常规勤务。编入一线分队的女战士同步参与上述后方勤务工作。', layers:{polaroid:{src:'images/汉阳造.jpg', caption:'汉阳造步枪 · 红色女战士的武器'}, photo2:{src:'images/女战士.jpg', caption:'李桂英 · 持枪杀敌的英姿'}, photo3:{src:'images/女战士合影.png', caption:'红军女战士 · 战地合影'}, photo4:{src:'images/女战士合影jpg.jpg', caption:'长征途中的她们 · 巾帼不让须眉'}}}, archives:[{title:'红军中的她们：中央红军长征女战士',text:'1934年10月中央红军实施战略转移前夕，中共中央经筛选拟定32名随军女同志名单，最终2人因身体原因留守中央苏区，共计30名女战士随主力从江西于都出发长征。该群体初期统一组建妇女队，由刘群先担任队长，金维映担任政治委员。\n湘江战役中，后方附属人员需承担阵地警戒、伤员转运、失散人员收容等常规勤务。编入一线分队的女战士同步参与上述后方勤务工作。',artifacts:[{img:'https://picsum.photos/seed/rifle2/200/150',desc:'汉阳造步枪'},{img:'https://picsum.photos/seed/female2/200/150',desc:'女战士形象'}]}], guide:'在绝境中，有人伸手拉你一把。这就是战友。', nextRaw:'unit2_3' },
    { id:'unit2_3', type:'scene', unit:'第二单元 · 惶恐', title:'老山界黑夜行军', theaterData:{theaterClass:'laoshanjie-theater', buttonText:'翻越黑夜之岭 · 继续漫漫征途', boardTitle:'历史档案 · 翻越老山界 —— 长征第一座险山', boardText:'老山界属于越城岭山脉，是中央红军长征途中翻越的第一座高山，山势陡峭、道路狭窄，主峰海拔超过2000米，自古便是险途。1934年12月4日至8日，刚刚经历湘江血战的中央红军分三路翻越老山界，目的是快速摆脱尾随的国民党追兵，向贵州方向挺进。\n为规避空中侦察与地面敌军袭扰，红军全程采用夜间隐蔽行军模式，队伍在无灯火的深山险路中跋涉。翻越老山界不仅是一次地理上的跋涉，更是红军在惨重损失后，重整队伍、继续西进的重要转折点。', layers:{polaroid:{src:'images/t012c54b3216dcbcc67.jpg', caption:'老山界 · 黑夜行军纪实'}, photo2:{src:'images/绑腿.jpg', caption:'红军绑腿 · 行军必备'}, photo3:{src:'images/彭绍辉长征日记jpg.jpg', caption:'彭绍辉长征日记 · 老山界篇'}}}, number:'场景 3 / 4', bg:'scene-bg-2', nodeIndex:1, blocks:[{type:'narr',speaker:'赵小二',text:'我们跟随队伍一路辗转，翻越了高耸险峻的老山界。连日阴雨连绵，山路陡峭得近乎垂直，两侧便是万丈深渊。为躲避敌机侦察与敌军追击，全军严禁点火，我们只能在漆黑的夜色里，拽着前方战友的衣角艰难挪动。'},{type:'narr',text:'一路流血牺牲、日夜奔波，前路望不到尽头。我心中的迷茫越来越重：我们日复一日吃苦、牺牲，这样的长征，究竟要走向何方？我们所承受的一切，又到底是为了什么？',highlight:true}], archives:[{title:'历史档案：翻越老山界 —— 长征第一座险山',text:'老山界属于越城岭山脉，是中央红军长征途中翻越的第一座高山，山势陡峭、道路狭窄，主峰海拔超过2000米，自古便是险途。1934年12月4日至8日，刚刚经历湘江血战的中央红军分三路翻越老山界，目的是快速摆脱尾随的国民党追兵，向贵州方向挺进。\n为规避空中侦察与地面敌军袭扰，红军全程采用夜间隐蔽行军模式，队伍在无灯火的深山险路中跋涉。翻越老山界不仅是一次地理上的跋涉，更是红军在惨重损失后，重整队伍、继续西进的重要转折点。'}], guide:'黑暗中的每一步，都踩在未知上。但队伍没有停下。', nextRaw:'unit2_4' },
    { id:'unit2_4', type:'scene', unit:'第二单元 · 惶恐', title:'乌江归队，第一次识字', number:'场景 4 / 4', theaterData:{theaterClass:'wujiang-theater', buttonText:'接过星火之笔 · 走向觉醒之路', boardTitle:'红军中的Ta们 —— 长征时期红军宣传队', boardText:'红军宣传队归属各级政治部管理，团级单位设专职宣传队，文艺分队统一并入宣传体系。依据1934年红军总政治部相关政治指令，宣传队在长征途中承担三类固定工作：对内服务指战员，对外联系群众，对敌开展工作。\n1935年1月初，中央红军于乌江休整期间，宣传队持续开展识字教学、思想宣讲等常态化工作。各分队利用行军、宿营间隙开展口头动员、文化扫盲、纪律宣讲与文艺活动，就地取用树枝、木炭等物资开展识字教学，沿途书写标语、张贴布告、散发传单，走访民众并开展民情调查。', layers:{polaroid:{src:'images/红星画报1.jpg', caption:'红星画报 · 第1期'}, photo2:{src:'images/木板标语打土豪分田地.jpg', caption:'木板标语 · 打土豪分田地'}, photo3:{src:'images/农村阶级划分五言歌.jpg', caption:'农村阶级划分五言歌'}, photo4:{src:'images/红一方面军写的木板标语.png', caption:'红一方面军木板标语'}, photo5:{src:'images/红军战士读本.png', caption:'红军战士读本 · 识字教材'}, photo6:{src:'images/屏幕截图 2026-06-11 101230.png', caption:'宣传队历史影像资料'}}}, bg:'scene-bg-2', nodeIndex:1, blocks:[{type:'narr',speaker:'赵小二',text:'1934年12月初，我们翻越了广西境内的老山界，又辗转经过黎平、剑河、台拱、黄平、瓮安，一路追着主力留下的路标和标语，整整一个多月，终于在1935年1月初乌江边追上了大部队。'},{type:'narr',text:'宿营时，微弱的火堆旁，红军文工团的宣传员林晓月拉过了我的手。她家境贫寒，家里有好几个弟弟。父母养不活那么多孩子，就把她卖到了妓院。她最终逃了出来，听说红军男女平等，就加入了红军。她用一根树枝，在我的手心里一笔一画地写下"革命"和"自主"两个字。'},{type:'dialogue',speaker:'林晓月',text:'"小二，在旧社会里，女人、穷人，命就像牲口一样被买卖践踏。逃出来当红军，是姐一生最勇敢的反抗。我们现在走的每一步夜路，吃的每一份苦，都是为了让天下的穷人都能自主掌控命运，不受人随意践踏，那才配叫作人！把你的号擦干净，总有一天，我们要吹响胜利的号声。"'},{type:'narr',text:'从那天起，我捡起铅笔头、收集报纸残页，利用行军休息的间隙认字学习。革命的火苗，第一次在我的心底真正点燃。归队后，我被编入了后勤物资岗位。',highlight:true}], archives:[{title:'红军中的"Ta"们 —— 长征时期红军宣传队',text:'红军宣传队归属各级政治部管理，团级单位设专职宣传队，文艺分队统一并入宣传体系。依据1934年红军总政治部相关政治指令，宣传队在长征途中承担三类固定工作：对内服务指战员，对外联系群众，对敌开展工作。\n1935年1月初，中央红军于乌江休整期间，宣传队持续开展识字教学、思想宣讲等常态化工作。',artifacts:[{img:'https://picsum.photos/seed/propa1/200/150',desc:'宣传队识字教学'},{img:'https://picsum.photos/seed/slogan1/200/150',desc:'木板标语：打土豪分田地'}]}], guide:'湘江的硝烟渐渐散去，但前方的路更加艰险。赵小二心中的火种，正在燃烧。', nextRaw:'unit3_intro' },
    { id:'unit3_intro', type:'intro', unit:'第三单元', title:'觉醒 · 赤水铁索', bg:'scene-bg-3', nodeIndex:2, introText:'1935年1月，遵义会议召开，中央红军迎来历史转折。此后红军四渡赤水、巧渡金沙江，接连突破敌军封锁，行军全程物资极度短缺。部队继续北上，先后强渡大渡河、飞夺泸定桥，攻克多处天险。\n一系列战斗结束后，部队进行人员整编与岗位调整。"红小鬼"赵小二在转战途中见证牺牲与坚守，思想逐步觉醒，最终正式成为一名随军宣传队员。', guide:'赤水河畔的转战、大渡河上的铁索，赵小二在战火中觉醒。', nextRaw:'unit3_1' },
    { id:'unit3_1', type:'scene', unit:'第三单元 · 觉醒', title:'遵义休整，遇见大锤叔', number:'场景 1 / 4', bg:'scene-bg-3', nodeIndex:2, blocks:[{type:'narr',speaker:'赵小二',text:'1935年1月，红军占领遵义，召开了遵义会议。我们基层战士并不清楚会上发生了什么，只是隐约感到队伍里多了几分生气，纪律更严了，行军更有章法了。'},{type:'narr',text:'在这里，我遇到了年近四十的炊事老兵王大锤，他常年背着行军铁锅，脊梁被压得微微弯曲。他一辈子安分守己过日子，却因新官上任时强制全城商户跪拜献礼、摊派苛捐杂税，唯独他挺直腰杆不肯下跪，结果被官府当街拷打，血在他脸上不停地往下流。最后红军解放了县城救了他，他成为了炊事班第十八任炊事员。'}], archives:[{title:'历史档案：遵义会议与红军进驻后的整训',text:'1935年1月15日至17日，中共中央在贵州遵义召开了政治局扩大会议。会议严厉批评了博古和李德在军事上的单纯防御路线，取消了他们的最高军事指挥权，通过了《遵义会议决议》，并增选毛泽东为中央政治局常委。遵义会议是中国共产党第一次独立自主地运用马克思主义基本原理解决自身路线和组织问题的伟大转折点。',artifacts:[{img:'https://picsum.photos/seed/zunyi3/200/150',desc:'遵义会议室'},{img:'https://picsum.photos/seed/loushan/200/150',desc:'娄山关'}]}], guide:'遵义城头，红旗漫卷。赵小二在这里，遇见了一个改变他命运的人。', nextRaw:'unit3_2' },
    { id:'unit3_2', type:'scene', unit:'第三单元 · 觉醒', title:'四渡赤水，接过铁锅', number:'场景 2 / 4', bg:'scene-bg-3', nodeIndex:3, blocks:[{type:'narr',speaker:'赵小二',text:'二月到三月，我们跟随队伍在川黔滇边境来回转战，这便是四渡赤水。连续的急行军让所有人疲惫不堪，更残酷的是粮草彻底断绝。战士们只能煮皮带、啃野菜充饥。我连日饥饿，眼前一黑，重重栽倒在乱石滩上。'},{type:'narr',text:'当我醒来时，发现自己躺在枯草堆上，嘴里正被强行塞进一块硬邦邦、带着浓重汗味的青稞饼。那是不知多珍贵的最后一口干粮。而旁边的王大锤正弓着干瘪的脊梁，满脸黑青，大口大口地啃着用开水煮过的野菜和树皮，嘴角还沾着草根。'},{type:'dialogue',speaker:'赵小二',text:'"大锤叔！你天天背着这么重的铁锅走几百里路，你连一口饱饭都不吃！你把粮食给了我，你吃这个会死人的啊？！"'},{type:'dialogue',speaker:'王大锤',text:'"哭什么！老子当长工的兄弟就是因为去地主家讨一碗米汤，被活活咬死在门口！老子挺直了腰杆不给当官的下跪，红军拿我当兄弟！小二，这口锅就是全连战友的命。老子可以死，红军不能饿死！你是连队的未来，你得替老子……好好走出去！"'},{type:'narr',text:'当晚，王大锤再也没有站起来。他安详地闭上了眼睛，胃里只有几口没消化的野菜和树皮，手里却还死死攥着一小袋没舍得用的面粉。他是宁可自己饿死，也绝不让红军挨饿！我没有流泪，我默默走过去，小心地保管好这袋面粉。王大锤用生命教导了我什么是无私奉献与后勤坚守。行军的间隙，我依然用树枝在泥地里默写林晓月姐教我的字，也把大锤叔牢牢地记在了心里。',highlight:true}], archives:[{title:'历史档案：四渡赤水作战',text:'1935年1月至5月，中央红军在毛泽东、周恩来、王稼祥组成的军事指挥小组指挥下，在川黔滇交界处的赤水河流域与国民党40万追兵展开了高频转战。四渡赤水彻底摆脱了长征以来的被动局面。受敌军军事围剿、经济封锁以及连续作战消耗影响，该阶段红军粮草供应全面中断，全体指战员长期处于饥饿状态。'},{title:'红军中的"Ta"们 —— 炊事员',text:'长征期间，红军炊事员是基层连队中体力负荷极重、减员极为严重的后勤群体。行军时，他们除随身装备外，还需用扁担挑运大锅、铁铲、劈柴及全连粮食，实际负重常达30至40公斤；由于部队频繁长途转战，炊事员必须在宿营后立即寻柴生火、全军出发前提前做饭，长期处于严重睡眠不足与体力透支的状态。在翻越雪山草地期间，这种超负荷劳作导致炊事员因高原反应、虚脱和极度饥饿而倒毙牺牲的比例居高不下。',artifacts:[{img:'https://picsum.photos/seed/pot3/200/150',desc:'铁锅，炊事兵的象征'},{img:'https://picsum.photos/seed/veg3/200/150',desc:'野菜，充饥的救命粮'},{img:'https://picsum.photos/seed/pottery/200/150',desc:'二渡赤水时的碎陶罐'}]}], guide:'一口铁锅，一份嘱托。大锤叔走了，但他的精神留在了赵小二心里。', nextRaw:'unit3_3' },
    { id:'unit3_3', type:'scene', unit:'第三单元 · 觉醒', title:'巧渡金沙江，六只破船', number:'场景 3 / 4', bg:'scene-bg-3', nodeIndex:4, blocks:[{type:'narr',speaker:'赵小二',text:'告别赤水流域，我们顶着烈日昼夜不停向金沙江方向赶路，即使体力不支，我始终不敢有丝毫懈怠。队伍抵达皎平渡口时，全军只征集到六艘民用木船。'},{type:'narr',text:'渡江行动从夜间开始，我负责清点物资、引导战友有序登船。江水流势湍急，船只数次触碰暗礁、险象环生，战士们齐心协力化解危机。五天五夜，六只破船，两万多人马，无一损失，全部渡过了金沙江。'},{type:'narr',text:'我们刚过完江，追兵就赶到了岸边。他们望着滔滔江水，只捡到了我们丢弃的一只破草鞋。那天晚上，大家围着篝火又笑又哭。我心里默默地说：大锤叔，你看到了吗？我们过来了。',highlight:true}], archives:[{title:'历史档案：巧渡金沙江战役',text:'1935年4月至5月，中央红军实施了"巧渡金沙江"这一战略转移中的决定性战役。从5月3日至9日，在刘伯承、陈云等坐镇的渡江司令部严密组织下，3万红军仅靠7条木船（实际可用6条）历时七天七夜安全渡江，彻底甩掉了数十万追兵，粉碎了蒋介石围歼红军于川黔滇边境的计划。',artifacts:[{img:'https://picsum.photos/seed/jinsha3/200/150',desc:'巧渡金沙江场景'}]}], guide:'六只破船，渡过了千军万马。奇迹，是用信念创造的。', nextRaw:'unit3_4' },
    { id:'unit3_4', type:'scene', unit:'第三单元 · 觉醒', title:'天险飞渡：大渡河与泸定桥', number:'场景 4 / 4', bg:'scene-bg-3', nodeIndex:5, blocks:[{type:'narr',speaker:'赵小二',text:'1935年5月中旬，大渡河根本不是河，是吃人的深渊。浪头几米高，对岸碉堡吐着火舌，水面像开了锅。'},{type:'narr',text:'我守在后方物资站，看不清小船上的细节。但那震天的军号声、枪炮声和呐喊声，一浪一浪砸过来。后来伤员抬下来，我凑上去听。他们说：十七个勇士，挤一条破船，顶着弹雨硬冲。有人中弹倒下，旁边的立刻按住；炮弹像长了眼睛，炸飞了对岸的碉堡。船靠岸了，勇士们跳进齐腰深的急流，挥着大刀扑上滩头。对岸的国民党兵吓得掉头就跑。'},{type:'narr',text:'红旗插上山头。十七个，都活着！\n我攥紧拳头，手心全是汗。那一刻，我心里烧起一把火：原来红军不怕死，是真的。',highlight:true},{type:'narr',text:'由于安顺场船只数量有限，全军立刻踏上昼夜二百四十里的急行军。赶到泸定桥头时，眼前的惨烈更令人倒吸凉气：十三根光秃秃的冰冷铁索悬在激流上，木板被拆光，对岸桥头堡火光冲天。'},{type:'narr',text:'战役打响后，我在后方临时救治点飞奔递送药品，一抬头，只能看到铁索上蠕动的黑影和火光中冲锋的身影。子弹打在铁索上火花四溅，不断有勇士中弹坠入滔滔江水，而后面的战友踩着血迹继续疯狂往前爬，最终化作燃烧的火人义无反顾地冲进桥头火海，生生夺下了泸定桥。'},{type:'narr',text:'看着被鲜血染红的铁索和抬下来的重伤员，我泪流满面。这两场硬仗将"不怕牺牲、冲锋在前"的突击队精神刻进了我的骨髓。',highlight:true}], archives:[{title:'历史档案：大渡河系列战役',text:'1935年5月，中央红军先遣队于24日袭占安顺场渡口。25日晨，17名勇士组成渡河突击队，冒着密集枪弹强渡登岸。但因只找到1只木船，红军大部队无法全部渡河，毛泽东果断决定兵分两路，夺取上游泸定桥。\n红4团奉命为左路军先锋团，一昼夜疾行240里，于29日凌晨赶到泸定桥西岸。此时桥上木板已被拆除，只剩下13根铁索链。29日下午4时，22名勇士冒着弹雨攀爬铁索，冲过火海夺下桥头，占领了泸定城。',artifacts:[{img:'https://picsum.photos/seed/luding3/200/150',desc:'飞夺泸定桥'},{img:'https://picsum.photos/seed/chain3/200/150',desc:'泸定桥铁锁链'},{img:'https://picsum.photos/seed/gun3/200/150',desc:'仿启拉利机枪'}]}], guide:'赤水河畔的转战、大渡河上的铁索，赵小二在战火中觉醒。然而，真正的绝境还在前方。', nextRaw:'unit4_intro' },
    { id:'unit4_intro', type:'intro', unit:'第四单元', title:'坚韧 · 生死绝境', bg:'scene-bg-4', nodeIndex:6, introText:'中央红军接连打赢强渡大渡河、飞夺泸定桥等关键战斗，顺利闯过多处天险。在一路转战的间隙，赵小二始终坚持刻苦识字，慢慢掌握了基础文化知识，随后主动申请调入宣传队。\n枪林弹雨的考验暂时落幕，但前路并非一片坦途，还有更为严峻的艰难险阻，在等待着他与全体红军战士。', guide:'雪山草地的生死考验，即将开始。', nextRaw:'unit4_1' },
    { id:'unit4_1', type:'scene', unit:'第四单元 · 坚韧', title:'风雪夹金山', number:'场景 1 / 4', bg:'scene-bg-4', nodeIndex:6, blocks:[{type:'narr',speaker:'赵小二',text:'1935年6月，红军开始翻越终年积雪的夹金山。6月12日清晨，炊事班烧了几大锅辣椒汤，我们每人喝下一大碗，顿时浑身冒汗，从嗓子眼一直辣到脚底板，我们就是顶着这股辣劲儿，开始爬雪山的。'},{type:'narr',text:'刚上山时，并没有觉得多累，脚下是坚硬的雪壳，阳光照在积雪上格外刺眼，宣传队的小宋跟在我身后，总是一副乐呵呵的样子，一边走一边哼着江西老家的山歌。可越往山顶行进，山势愈发陡峭，空气也变得稀薄，我心跳得厉害，嘴唇发紫，脸色发青，两腿发软，胸口像压了块大石头，走几步就要停下来大口大口地喘气。'},{type:'narr',text:'行至半山腰，老天爷翻了脸，狂风裹挟着冰雹骤然袭来，天地间白茫茫一片，分不清方向。体力透支的我一头栽倒在雪地里，浑身冻得麻木。'},{type:'narr',text:'"小二！小二！"有人在喊我。我迷迷糊糊睁开眼，看到一个身影蹲在我身边——是苏博文，队伍里那个上海来的知识分子。他出身于富商家庭，出国留学归来，当他看到了贫民被官兵和地主压迫的时候，他决定追随自己的理想，一路从上海追到了苏区，加入了红军。'},{type:'narr',text:'他戴着深度近视眼镜，镜片上糊满了雪，脸色冻得青紫，嘴唇已经发黑。他平时身体就弱，走这种路比我们更吃力。风雪之中，他执意把大衣披在我的身上。我浑身哆嗦，被他架着一步一步往上拖。他的眼镜掉了一只，没顾上捡；另一只镜片上全是冰碴，他索性摘下来扔掉。'},{type:'dialogue',speaker:'苏博文',text:'"小二，勇敢是筋骨，学识是脊梁！红军既要能吃苦，更要懂理想！你是宣传队的苗子，你得替我们这些人……把路走下去！"'},{type:'narr',text:'他的话像一把火，烧进了我的心里。我咬着牙，撑着膝盖站起来，一步、两步、三步……可苏博文的脚步越来越慢，呼吸越来越重。他的脸色从青紫变成了灰白，嘴唇几乎没有了血色。'},{type:'dialogue',speaker:'赵小二',text:'"苏教员！苏教员！"'},{type:'narr',text:'他冲我笑了笑，那笑容在风雪里显得那么虚弱：'},{type:'dialogue',speaker:'苏博文',text:'"小二……我走不动了。你先走……别管我。"'},{type:'narr',text:'最终，这位学识渊博的战友耗尽了全部力气，永远留在了这座雪山之上。小宋从后面赶上来，看到这一幕，腿一软跪在雪地里，抱着苏博文的胳膊哭得说不出话。我狠狠抹了一把眼泪，把小宋从地上拽起来：'},{type:'dialogue',speaker:'赵小二',text:'"走！苏教员走了，我们得替他走出去！他的路，我们接着走！"'},{type:'narr',text:'越往山顶走，看到的景象越让人心碎。路边、雪坑里，三三两两躺着已经牺牲的战友。我们强忍悲痛继续攀登，整整七个小时才抵达山顶。下山之后，我们与红四方面军的战友胜利会合，山谷里响起阵阵欢呼。'}], archives:[{title:'历史档案：翻越夹金山与懋功会师',text:'夹金山主峰海拔4900余米，终年积雪，有"死亡之山"之称。6月12日至18日，中央红军主力全部翻过夹金山，在达维镇与红四方面军先头部队胜利会师。翻越过程中，红军遭受了大量非战斗减员，仅夹金山一役，非战斗性减员在两千人以上。'},{title:'红军中的知识分子',text:'长征队伍中有一批并非因贫困求生、而是出于革命理想自觉投身革命的红军战士。他们大多出身优渥，接受过良好教育，许多人还有留学经历，却在民族危亡之际毅然抛弃个人前程，走上革命道路。以周恩来为典型，这类知识分子在长征中人数虽少，却在军事指挥、情报、宣传、医疗等领域发挥关键作用。文学家成仿吾、钱壮飞、陈伯钧、冯雪峰等，都是这支队伍中"火种"般的核心力量。',isSidecard:true,artifacts:[{img:'https://picsum.photos/seed/snow4/200/150',desc:'过雪山雕塑'},{img:'https://picsum.photos/seed/glasses4/200/150',desc:'谢觉哉长征戴的眼镜'},{img:'https://picsum.photos/seed/lamp4/200/150',desc:'林伯渠用的油灯'}]}], guide:'雪山之上，有人永远留在了那里。但他们的信念，被活下来的人带走了。', nextRaw:'unit4_2' },
    { id:'unit4_2', type:'scene', unit:'第四单元 · 坚韧', title:'茫茫松潘草地', number:'场景 2 / 4', bg:'scene-bg-4', nodeIndex:7, blocks:[{type:'narr',speaker:'赵小二',text:'8月，红军进入了长征中最艰难的自然考验——徒步穿越荒无人烟、危机四伏的松潘大草地。'},{type:'narr',text:'出发前，首长让我组织收容队，走在全军最后，负责救护掉队的人，掩埋牺牲的战友。每人准备了十天干粮。'},{type:'narr',text:'8月23日一早，我们随主力出发，收容队走在最后。一进草地，天地间只有齐腰深的野草和黑色积水，雾气弥漫，不见村舍。部长警告：水不能喝，脚不能划破，走路必须踩草根，否则陷进泥潭就没命。'},{type:'narr',text:'收容队每天从清晨忙到深夜：搜救掉队的人，包扎伤口，架着走不动的战友，掩埋再也没有醒来的遗体。天气说变就变，暴雨一来，草地变成汪洋，冰冷的积水没过膝盖。我亲眼看见两个队员陷进泥潭，越挣扎沉得越快，大家用绑腿拧成绳子才把他们拖出来。那一刻，我才知道什么叫"每一步都像在刀尖上跳舞"。',highlight:true},{type:'narr',text:'天黑宿营，遍地是水，火柴全湿了，半夜才点着一堆火。我累得坐下就昏睡过去，清晨醒来，发现自己整个屁股陷进泥里，水淹到了肚子——是战友把我拽出来的。从那以后，我连睡觉都得睁一只眼。'},{type:'narr',text:'第三天，粮食告急。收容队人数在增加，粮食却在减少。我狠心规定：每人每天只给一小把青稞。第四天傍晚，粮食彻底断了。我们杀掉两匹马，每人分到一小块肉，那是救命的。\n断粮的日子，胃像被手拧着。我们开始吃树皮、草芯、煮皮靴。树皮又硬又苦，老战士教我用火烤软、糊上泥巴、夹着草芯，才能勉强咽下去。草鞋的皮底子煮软了嚼，像胶皮，但总比饿着强。'}], archives:[{title:'历史档案：红军过草地',text:'因松潘战役计划受阻，红军被迫穿越川西北的松潘草地，该区域面积约1.52万平方公里，平均海拔3500米以上。草地行军面临沼泽陷溺、暴雨失温、粮食断绝等致命威胁。据不完全统计，红一方面军过草地减员6207人，红二方面军减员3092人，红四方面军因三次穿越草地减员超过15000人。即将走出草地时，在班佑河畔曾有七百余名红军战士因体力耗尽、背靠背坐在一起牺牲。',artifacts:[{img:'https://picsum.photos/seed/grass4/200/150',desc:'吃剩的皮带'},{img:'https://picsum.photos/seed/grass5/200/150',desc:'草地行军场景'}]}], guide:'草地的每一寸土地，都吞噬过生命。但收容队从未放弃任何一个人。', nextRaw:'unit4_3' },
    { id:'unit4_3', type:'scene', unit:'第四单元 · 坚韧', title:'草地顽疾', number:'场景 3 / 4', bg:'scene-bg-4', nodeIndex:7, blocks:[{type:'narr',speaker:'赵小二',text:'第五天，我病倒了。一会儿冷得浑身哆嗦，裹两层毯子像掉进冰窟窿；一会儿烧得神志不清，说胡话。腿软得像面条，站都站不稳。我知道这是"打摆子"——疟疾，在江西时见过，可没想到会在草地里摊上。'},{type:'narr',text:'迷迷糊糊中，我看到一张满是泥水的大胡子脸凑了过来。那是米勒医生，我们私下都叫他"大鼻子"。他是一位外国来的医生，金发碧眼，穿着一件脏兮兮的白大褂，手里拎着一个破旧的药箱。红军长征时他执意跟着走，说医生的职责是跟着伤员。'},{type:'narr',text:'他用生硬的中国话说："别动。"翻了翻我的眼皮，从药箱里倒出一点灰褐色的粉末——柴胡粉，不多了。喂我喝下去，又苦又涩。他说疟疾没特效药，只能靠自己扛。可草地里哪能休息？队伍不能停。'},{type:'narr',text:'他沉默了一会儿，从药箱底层翻出一小块干硬的红糖，掰下一角塞进我嘴里。"含着，补充点力气。"然后对队员说："轮流架着他走，别让他掉队。"'},{type:'dialogue',speaker:'米勒医生',text:'"药是死的，人是活的。红军的命，比什么都硬。你撑得住。"'},{type:'narr',text:'从那以后，两个队员轮流架着我，一步一步在泥水里挪。高烧烧得眼前发黑，我就咬嘴唇，咬破了，血渗进嘴里，咸腥的。发冷时裹紧毯子，缩成一团。米勒医生每天都来看我，药箱越来越空。后来连柴胡粉也没了，他就找野草煮水给我喝。我知道未必管用，但每次喝下去，心里就多一分底气——有人在救我，我不能倒下。'},{type:'narr',text:'第八天清晨，烧终于退了。我撑着棍子站起来，腿还在打颤。米勒医生难得地笑了笑："我说过，红军的命，比什么都硬。"'}], archives:[{title:'红军中的国际友人',text:'长征队伍中包括一定数量的外国人员，构成较为多元。李德是走完长征全程的少数西方人之一；朝鲜籍的毕士悌和武亭随红军参加长征；洪水是唯一走完长征全程的越南籍战士。此外，瑞士人薄复礼亲笔写下了首本宣传中国红军的长篇著作；马海德和傅莱长征到达陕北后投入到部队医疗工作中；斯诺于1936年向全世界第一次全面报道了长征。'},{title:'历史档案：打摆子',text:'疟疾俗称"打摆子"，由蚊虫叮咬传播，症状为周期性发冷、高热、大量出汗。长征途中，疟疾频繁爆发，成为非战斗减员的主要疾病之一。由于治疗疟疾的特效药奎宁极为稀缺，多数患者只能依靠身体自愈与顽强意志硬撑。',artifacts:[{img:'https://picsum.photos/seed/doctor4/200/150',desc:'傅连暲治疗红军用的洗脚杯'},{img:'https://picsum.photos/seed/stretcher4/200/150',desc:'担架，救命的工具'},{img:'https://picsum.photos/seed/pen4/200/150',desc:'斯诺赠送的钢笔'}]}], guide:'在生死边缘，有人用尽全力把你拉回来。这就是信仰的力量。', nextRaw:'unit4_4' },
    { id:'unit4_4', type:'scene', unit:'第四单元 · 坚韧', title:'忠骨留荒原', number:'场景 4 / 4', bg:'scene-bg-4', nodeIndex:7, blocks:[{type:'narr',speaker:'赵小二',text:'第八天中午，小宋撑不住了。他躺在泥地上，脸色蜡黄，瘦得脱了相。我抱住他，他睁开眼，嘴角扯出一丝笑意：'},{type:'dialogue',speaker:'小宋',text:'"队长……我怕是走不出去了……"'},{type:'narr',text:'我拼命喊他撑住，可他像一摊泥。'},{type:'dialogue',speaker:'小宋',text:'"小二哥……我想家……想我娘……"'},{type:'narr',text:'话没说完，头一歪，手垂了下去。'},{type:'narr',text:'他活过了雪山，却没走出这片泥沼。我抱着他，浑身发抖，眼泪止不住。我用刺刀挖了个坑，把他放进去，个子小得像只猫。我正了正他的军帽，用青草盖住他的脸：'},{type:'dialogue',speaker:'赵小二',text:'"等革命胜利了，我替你去看看你娘——她儿子是英雄。"'},{type:'narr',text:'下午，更大的噩耗。国民党骑兵偷袭收容队，好几个战友倒下。我冲过去扶起一个满身是血的人——是陈小石头，我的老连长！他胸口被子弹打穿，血往外涌。他看清是我，欣慰地笑了一下，头一歪，再也没了动静。我抱着他，哭不出声。我把他的遗体背到高坡上，和其他战友一起掩埋。一铲一铲土盖上去，我的手在抖，心在滴血。可我告诉自己：不能哭，还有活着的人要救。'},{type:'narr',text:'八天八夜，我们掩埋了四百多具遗体。米勒医生也负了伤，自己包扎后又去救别人。草地像一座巨大的坟场，可我们凭着信念走了出来。带着牺牲战友的嘱托，活了下来。'},{type:'narr',text:'我常常想起小宋，想起老连长，想起苏博文。他们在最黑的夜里，用自己的命，点亮了别人的路。',highlight:true}], archives:[{title:'历史档案：红军中的非战斗减员',text:'非战斗减员指非直接作战造成的损失，主要包括因疲劳掉队、伤残疾病、缺粮饿死、恶劣环境致病致死等。雪山草地是非战斗减员最为集中的阶段，红军三大主力在此期间非战斗减员至少在万人以上。长征平均每公里就有3至4名红军将士牺牲，平均每4人中仅有1人到达陕甘根据地。',artifacts:[{img:'https://picsum.photos/seed/fall4/200/150',desc:'英勇不屈'},{img:'https://picsum.photos/seed/wall4/200/150',desc:'血肉长城'}]}], guide:'雪山草地的生死考验，让赵小二完成了最后的蜕变。胜利的曙光，就在前方。', nextRaw:'unit5_intro' },
    { id:'unit5_intro', type:'intro', unit:'第五单元', title:'星火永存', bg:'scene-bg-5', nodeIndex:8, introText:'闯过松潘草地，中央红军攻克腊子口天险，于1935年10月抵达陕北吴起镇。1936年10月，红军三大主力胜利会师，二万五千里长征宣告胜利结束。\n少年赵小二走完万里征途，回望一路艰辛与并肩前行的战友，完成了从懵懂孩童到信仰坚定的红军战士的蜕变。长征的伟大胜利，在中国革命史上写下浓墨重彩的篇章。', guide:'长征结束了，但赵小二的故事并未完结。属于我们每个人的新时代长征，才刚刚开始。', nextRaw:'unit5_1' },
    { id:'unit5_1', type:'scene', unit:'第五单元 · 星火', title:'激战腊子口', number:'场景 1 / 2', bg:'scene-bg-5', nodeIndex:9, blocks:[{type:'narr',speaker:'赵小二',text:'走出茫茫草地，我们立刻投入到腊子口的战斗中。这里两山壁立，隘口狭窄，是北上的唯一通道，敌军依托险要地势严防死守。'},{type:'narr',text:'我跟随医疗和收容队伍往返阵地之间，冒着乱飞的流弹转运伤员、递送物资。亲眼看着战友们沿着绝壁迂回包抄，在隘口浴血拼杀。经历过雪山、草地的万般磨难，再直面枪林弹雨，我的内心早已不再胆怯。这场战斗为北上打通了最后一道关口，也让我更加明白，胜利从来都是用坚守换来的。',highlight:true}], archives:[{title:'历史档案：腊子口战役',text:'1935年9月16日至17日，中央红军发起腊子口战役。腊子口地处甘肃迭部，峡谷狭窄、两侧山崖陡峭，是川西北进入甘肃的咽喉要道。红军采取正面强攻与侧翼迂回相结合的战术，突破敌军防线，攻克腊子口。此战是中央红军长征途中最后一场关键性隘口战斗，彻底扫清北上道路。'}], guide:'腊子口的天险，挡不住红军的脚步。胜利，已经不远了。', nextRaw:'unit5_2' },
    { id:'unit5_2', type:'scene', unit:'第五单元 · 星火', title:'吴起镇会师 · 少年终成长', number:'场景 2 / 2', bg:'scene-bg-5', nodeIndex:9, blocks:[{type:'narr',speaker:'赵小二',text:'翻过一道道山岭，我们终于踏上了黄土高原。1935年10月，队伍抵达吴起镇，脚下不再是冰雪与泥潭，空气中飘着庄稼的气息，连日的紧绷终于放松下来。'},{type:'narr',text:'陕北乡亲们热情地送来黄米糕、热饭食，暖意涌上心头。我看着身边欢呼的战友，一路的疲惫烟消云散。闯过了枪林弹雨、雪山草地，我们终于有了安稳的落脚之地，这份劫后余生的喜悦，深深烙印在心底。'},{type:'narr',text:'一年之后，红二、四方面军也奔赴而来，三大主力在甘肃会宁胜利会合。漫山遍野的红旗、震天的口号，让所有人热泪盈眶。'},{type:'narr',text:'两万五千里的风雨兼程终于画上圆满句号。这段征途里，有人永远留在了雪山草地，但他们的信念永远传承。最初我参军，只是想讨一口饱饭、不再流浪。走过这二万五千里，历经生死离别，我终于明白我们前行的意义。如今的我，早已不是那个只为活下去的孤儿，而是一名心怀信仰、愿意为穷苦大众奋斗的红军战士。看到路边流浪的孩童，我仿佛看到了曾经的自己，也懂得了肩上沉甸甸的责任。',highlight:true}], archives:[{title:'历史档案：吴起镇会师',text:'1935年10月19日，中央红军陕甘支队抵达陕西吴起镇。至此，中央红军历时一年、行程二万五千里的战略转移阶段性结束。1936年10月，红一方面军、红二方面军、红四方面军在甘肃会宁胜利会师，中国工农红军二万五千里长征全面胜利结束。\n长征的胜利，是中国革命转危为安的关键。它保存了中国革命和红军的骨干力量，铸就了伟大的长征精神。',artifacts:[{img:'https://picsum.photos/seed/victory5/200/150',desc:'胜利抵达陕北'},{img:'https://picsum.photos/seed/victory6/200/150',desc:'陕北会师场景'}]}], guide:'长征结束了，但赵小二的故事并未完结。属于我们每个人的新时代长征，才刚刚开始。', nextRaw:'epilogue' },
    { id:'epilogue', type:'epilogue', unit:'结语', title:'星火永存 · 新时代长征', bg:'scene-bg-epilogue', nodeIndex:9, blocks:[{type:'narr',text:'二万五千里长征，是一场跨越千山万水的伟大远征。红军从江西于都出发，冲破层层封锁，转战数省，闯过枪林弹雨，翻越皑皑雪山，跋涉茫茫草地，历经无数艰难险阻，最终三大主力胜利会师陕北。长征的伟大胜利，彻底扭转了中国革命的危局，为革命事业保存下弥足珍贵的骨干力量。'},{type:'narr',text:'漫漫征途中，大批出身贫苦的流浪少年、穷苦子弟投身红军。以本展主人公赵小二为代表的红小鬼，和奋战在各个岗位的全体红军将士一道，在严酷的行军与战斗中坚守使命。无数先烈为了革命理想舍生取义、无私奉献，而昔日懵懂的孩童，也在血与火的磨砺中锤炼意志，一步步成长为信仰坚定的革命战士。'}], guide:'赵小二的万里长征已然落幕。属于我们每个人的新时代长征，才刚刚启程。' }

    function buildPages(rawScenes) {
        const pages = [], idMap = {};
        rawScenes.forEach(raw => {
            const isScene = raw.type === 'scene' && raw.archives && raw.archives.length > 0;
            if (isScene) {
                const nId = raw.id + '_narr', aId = raw.id + '_arch';
                pages.push({ id:nId, type:'narrative', unit:raw.unit, title:raw.title, number:raw.number, bg:raw.bg, nodeIndex:raw.nodeIndex, blocks:raw.blocks, guide:raw.guide, next:aId, rawId:raw.id, heroImage:raw.heroImage||null, imageCaption:raw.imageCaption||null, theaterData:raw.theaterData||null });
                pages.push({ id:aId, type:'archive', unit:raw.unit, title:raw.title, number:raw.number, bg:raw.bg, nodeIndex:raw.nodeIndex, archives:raw.archives, guide:raw.guide, next:raw.nextRaw||null, rawId:raw.id });
                idMap[nId]=pages[pages.length-2]; idMap[aId]=pages[pages.length-1];
            } else {
                const p = { id:raw.id, type:raw.type, unit:raw.unit, title:raw.title, bg:raw.bg, nodeIndex:raw.nodeIndex||0, guide:raw.guide, next:raw.nextRaw||null, rawId:raw.id };
                if (raw.type==='intro') p.introText=raw.introText; else if (raw.type==='hero'||raw.type==='epilogue') p.blocks=raw.blocks;
                pages.push(p); idMap[raw.id]=p;
            }
        });
        pages.forEach(p => { if (p.next && !p.next.endsWith('_narr') && !p.next.endsWith('_arch')) { const r = rawScenes.find(r=>r.id===p.next); if (r && r.type==='scene' && r.archives && r.archives.length) p.next = r.id+'_narr'; } if (!p.next) p.next=p.id; });
        return {pages, idMap};
    }
    const {pages, idMap} = buildPages(rawScenes);

        for(let i=0;i<pts.length-1;i++){const done=i<si;const dx=pts[i+1].x-pts[i].x,dy=pts[i+1].y-pts[i].y;const len=Math.sqrt(dx*dx+dy*dy).toFixed(1);svg+=`<line x1="${pts[i].x}" y1="${pts[i].y}" x2="${pts[i+1].x}" y2="${pts[i+1].y}" class="map-path${done?' done':''}"${done?` style="--path-len:${len};"`:''} />`;}

            if(hasTheater){const td=data.theaterData;html+=`<div class="theater-story"><div class="story-inner-header">${data.unit?`<span class="unit-tag">${data.unit}</span>`:''}<h3>${data.title}</h3><span class="page-type-tag">赵小二的故事</span></div><div class="narrative" id="narr_${data.id}" style="flex:1;overflow-y:auto;">`;data.blocks.forEach((b,bi)=>{let cls='narr-block'+(bi===0?' visible':'');html+=`<div class="${cls}" data-order="${bi}">`;if(b.type==='narr'){if(b.speaker)html+=`<span class="speaker">${b.speaker}</span>`;html+=`<span class="qm">"</span>${b.text}<span class="qm end">"</span>`;}else if(b.type==='dialogue'){html+=`<span class="dialogue"><span class="who">${b.speaker||''}：</span>${b.text}</span>`;}html+=`</div>`;});html+=`<span class="continue-hint show" data-target="narr_${data.id}">▼ 点击继续</span></div></div>`;}
            else{html+=`<div class="narrative" id="narr_${data.id}">`;data.blocks.forEach((b,bi)=>{const cls=`narr-block ${bi===0?'visible':''}`;html+=`<div class="${cls}" data-order="${bi}">`;if(b.type==='narr'){if(b.speaker)html+=`<span class="speaker">${b.speaker}</span>`;html+=`<span class="qm">"</span>`;if(b.highlight){const parts=b.text.split(/(?<=[。！？])/);if(parts.length>1){const last=parts.pop();html+=parts.join('')+`<span class="hl">${last}</span>`;}else html+=`<span class="hl">${b.text}</span>`;}else html+=b.text;html+=`<span class="qm end">"</span>`;}else if(b.type==='dialogue'){html+=`<span class="dialogue"><span class="who">${b.speaker}：</span>${b.text}</span>`;}html+=`</div>`;});html+=`<span class="continue-hint show" data-target="narr_${data.id}">▼ 点击继续</span></div><div class="scene-divider"><span class="diamond"></span></div><div style="text-align:center;font-size:0.8rem;opacity:0.3;letter-spacing:2px;padding:2px 0 4px;">赵小二的讲述 · 点击下方了解历史背景</div>`;}
        }else if(data.type==='archive'){html+=`<div class="archive-section">`;data.archives.forEach((arch,ai)=>{const isSC=arch.isSidecard||false;if(ai>0)html+=`<div class="archive-sub">`;if(isSC){html+=`<div class="side-card"><h4>${arch.title}</h4><p>${arch.text}</p>`;if(arch.artifacts&&arch.artifacts.length){html+=`<div class="artifact-grid">`;arch.artifacts.forEach(a=>{html+=`<div class="art-item" style="background-image:url('${a.img}');" data-desc="${a.desc}"><div class="label">${a.desc}</div></div>`;});html+=`</div>`;}html+=`</div>`;}else{if(arch.title)html+=`<div class="archive-title"><span class="icon">${ai>0?'📖':'📜'}</span>${arch.title}</div>`;if(arch.text){html+=`<div class="archive-text">`;arch.text.split('\n').forEach(p=>{if(p.trim())html+=`<p>${p}</p>`;});html+=`</div>`;}if(arch.artifacts&&arch.artifacts.length){html+=`<div class="artifact-grid">`;arch.artifacts.forEach(a=>{html+=`<div class="art-item" style="background-image:url('${a.img}');" data-desc="${a.desc}"><div class="label">${a.desc}</div></div>`;});html+=`</div>`;}}if(ai>0)html+=`</div>`;});html+=`</div>`;}
        if(data.guide){html+=`<div class="scene-guide"><div class="guide-text">${data.guide.replace(/\n/g,'<br />')}</div>`;let bl='继续 →',bc='btn-next',ex='';if(data.type==='narrative'){bl='了解历史背景 →';bc='btn-next btn-next-narrative';}else if(data.type==='archive'){bl='继续赵小二的故事 →';ex=`<span class="transition-hint">历史档案读毕 · 回到赵小二的视角</span>`;}else if(data.type==='intro'){bl='进入单元 →';ex=`<span class="transition-hint">单元导语读毕 · 走进赵小二的故事</span>`;}else if(data.type==='hero')bl='走进第一单元 →';else if(data.type==='epilogue')bl='回到序厅';const nid=data.next;if(nid&&nid!==data.id&&idMap[nid]){if(data.type==='narrative')html+=`<button id="btn-next-${data.id}" class="${bc}" data-next="${nid}" style="display:none;">${bl} <span class="arrow">→</span></button>`;else if(data.type==='intro'||data.type==='archive')html+=`<div class="btn-transition-wrap"><div class="btn-transition-label">${data.type==='intro'?'单元导语读毕 · 走进赵小二的故事':'历史档案读毕 · 回到赵小二的视角'}</div><button class="${bc}" data-next="${nid}">${bl} <span class="arrow">→</span><span class="pulse-ring-btn"></span></button></div>`;else html+=`<div class="btn-with-label">${ex}<button class="${bc}" data-next="${nid}">${bl} <span class="arrow">→</span><span class="pulse-ring-btn"></span></button></div>`;}else if(data.type==='epilogue')html+=`<button class="btn-next" data-next="hero">回到序厅 <span class="arrow">→</span></button>`;html+=`</div>`;}
        if(!hasTheater)html+=`</div>`;
        if(hasTheater){const td=data.theaterData;const ly=td.layers||{};html+=`<div class="theater-evidence"><div class="theater-archive"><h3 class="archive-head">${td.boardTitle||''}</h3><div class="archive-body"><p>${td.boardText||''}</p>${td.balladText?`<span class="archive-ballad">${td.balladText}</span>`:""}</div></div>`;if(ly.polaroid)html+=`<div class="theater-photo pos-tl"><img src="${ly.polaroid.src||''}" alt="浮桥冲锋" loading="lazy" /><span class="photo-caption">${ly.polaroid.caption||''}</span></div>`;if(ly.chen)html+=`<div class="theater-photo pos-bl"><img src="${ly.chen.src||''}" alt="${ly.chen.caption||''}" loading="lazy" /><span class="photo-caption">${ly.chen.caption||''}</span></div>`;if(ly.photo2)html+=`<div class="theater-photo pos-tr"><img src="${ly.photo2.src||''}" alt="${ly.photo2.caption||''}" loading="lazy" /><span class="photo-caption">${ly.photo2.caption||''}</span></div>`;if(ly.photo3)html+=`<div class="theater-photo pos-bl"><img src="${ly.photo3.src||''}" alt="${ly.photo3.caption||''}" loading="lazy" /><span class="photo-caption">${ly.photo3.caption||''}</span></div>`;if(ly.photo4)html+=`<div class="theater-photo pos-br"><img src="${ly.photo4.src||''}" alt="${ly.photo4.caption||''}" loading="lazy" /><span class="photo-caption">${ly.photo4.caption||''}</span></div>`;if(ly.photo5)html+=`<div class="theater-photo pos-tc"><img src="${ly.photo5.src||''}" alt="${ly.photo5.caption||''}" loading="lazy" /><span class="photo-caption">${ly.photo5.caption||''}</span></div>`;if(ly.photo6)html+=`<div class="theater-photo pos-bc"><img src="${ly.photo6.src||''}" alt="${ly.photo6.caption||''}" loading="lazy" /><span class="photo-caption">${ly.photo6.caption||''}</span></div>`;if(ly.artifact)html+=`<div class="theater-photo pos-br"><img src="${ly.artifact.src||''}" alt="蓑衣文物" loading="lazy" /><span class="photo-caption">${ly.artifact.label||''}</span></div>`;html+=`</div></div><div class="theater-passage-wrap"><button class="theater-passage-btn" data-next="${data.next||''}">${td.buttonText||'越过血染之江 · 启程漫漫长征路'}</button></div></div>`;}
        else if(hasHeroImage){const im=data.imageCaption||{};html+=`<div class="scene-1-image-wrapper"><img class="battle-photo" src="${data.heroImage}" alt="${im.title||'湘江战役'}" loading="lazy" /><div class="image-caption-plate"><span class="caption-title">${im.title||''}</span><span class="caption-divider"></span><span class="caption-text">${im.text||''}</span></div></div></div>`;}
        container.innerHTML=html;
        const cardEl=container.querySelector('.scene-card');
        if(cardEl){applyCardDecor(bgClass,cardEl);const isNarr=data.type==='narrative';if(!isNarr&&!document.querySelector('.scene-card-stamp')){const st=document.createElement('div');st.className='scene-card-stamp';st.textContent='红军长征';cardEl.appendChild(st);}if(!cardEl.querySelector('.year-watermark')){const wm=document.createElement('div');wm.className='year-watermark wm-bottom-right';wm.textContent=yearWatermarks[bgClass]||'';cardEl.appendChild(wm);}}
        unitIndicator.innerHTML=`<strong>${data.unit||'序厅'}</strong>`;
        document.getElementById('prevBtn').style.opacity=idx>0?'1':'0.3';
        document.getElementById('nextBtn').style.opacity=idx<pageIds.length-1?'1':'0.3';
        renderMap(data.nodeIndex||0);
        bindPageEvents(data.id);
        if(data.type==='narrative')setupNarrative(data.id);
        if(hasTheater)setupTheaterInteraction(data.id);
        if(data.type==='epilogue')setupEpilogue();
        document.querySelectorAll('.art-item').forEach(el=>{el.addEventListener('click',function(){const bg=this.style.backgroundImage;const urlMatch=bg.match(/url\(["']?(.*?)["']?\)/);document.getElementById('modalImg').src=urlMatch&&urlMatch[1]?urlMatch[1]:'https://picsum.photos/seed/default/600/400';document.getElementById('modalDesc').textContent=this.dataset.desc||'文物展品';document.getElementById('modal').classList.add('active');document.body.style.overflow='hidden';});});
        content.scrollTop=0;
    }

    function setupNarrative(pageId){const nc=document.getElementById(`narr_${pageId}`);if(!nc)return;const blocks=nc.querySelectorAll('.narr-block');const hint=nc.querySelector('.continue-hint');const btn=document.getElementById(`btn-next-${pageId}`);if(!blocks.length)return;let cb=1,isComplete=false;if(blocks.length<=1){isComplete=true;if(btn){btn.style.display='inline-block';btn.classList.add('show');}hint.classList.remove('show');return;}function sn(){if(cb<blocks.length){blocks[cb].classList.add('visible');cb++;if(cb<blocks.length)hint.classList.add('show');else{hint.classList.remove('show');isComplete=true;if(btn){btn.style.display='inline-block';btn.classList.add('show');}}}else{hint.classList.remove('show');isComplete=true;if(btn){btn.style.display='inline-block';btn.classList.add('show');}}}hint.addEventListener('click',sn);nc.addEventListener('click',function(e){if(e.target.closest('.btn-next'))return;if(!isComplete&&cb<=blocks.length)sn();});if(blocks.length>1)hint.classList.add('show');else hint.classList.remove('show');}

    function setupEpilogue(){const mi=document.getElementById('messageInput'),sb=document.getElementById('sendMessage'),fb=document.getElementById('feedback');if(sb)sb.addEventListener('click',function(){const msg=mi.value.trim();if(msg){fb.textContent='感谢您的留言："'+msg+'" 长征精神永放光芒！';mi.value='';try{localStorage.setItem('red_xiaogui_msg',msg);}catch(e){}}else fb.textContent='请写下您的感想再提交。';});try{const s=localStorage.getItem('red_xiaogui_msg');if(s&&fb)fb.textContent='您曾留言："'+s+'"';}catch(e){}}

    function setupTheaterInteraction(pageId){const theaterEl=document.getElementById('theater_'+pageId);if(!theaterEl)return;const btn=theaterEl.querySelector('.theater-passage-btn');if(!btn)return;const newBtn=btn.cloneNode(true);btn.parentNode.replaceChild(newBtn,btn);newBtn.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();const target=this.dataset.next;if(!target||!idMap[target]){console.warn('theater: no valid next target');return;}const curtain=document.getElementById('bloodCurtainOverlay');if(curtain){curtain.classList.add('active');setTimeout(function(){curtain.classList.remove('active');const ix=pageIds.indexOf(target);if(ix!==-1)goToPage(ix);},700);}else{const ix=pageIds.indexOf(target);if(ix!==-1)goToPage(ix);}});}

    function goToPage(idx){if(isTransitioning||idx===currentIdx)return;if(idx<0||idx>=pageIds.length)return;isTransitioning=true;const dir=idx>currentIdx?1:-1;currentIdx=idx;renderPage(idx,dir);setTimeout(()=>{isTransitioning=false;},600);}

    function bindPageEvents(pid){document.querySelectorAll('.btn-next').forEach(btn=>{btn.addEventListener('click',function(e){e.stopPropagation();const t=this.dataset.next;if(t&&idMap[t]){const ix=pageIds.indexOf(t);if(ix!==-1)goToPage(ix);}});});}

    document.getElementById('prevBtn').addEventListener('click',function(){if(currentIdx>0)goToPage(currentIdx-1);});
    document.getElementById('nextBtn').addEventListener('click',function(){if(currentIdx<pageIds.length-1)goToPage(currentIdx+1);});
    document.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();if(currentIdx<pageIds.length-1)goToPage(currentIdx+1);}else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();if(currentIdx>0)goToPage(currentIdx-1);}});

    document.getElementById('modalClose').addEventListener('click',function(){document.getElementById('modal').classList.remove('active');document.body.style.overflow='';});
    document.getElementById('modal').addEventListener('click',function(e){if(e.target===this){this.classList.remove('active');document.body.style.overflow='';}});
    document.addEventListener('keydown',function(e){if(e.key==='Escape'){document.getElementById('modal').classList.remove('active');document.body.style.overflow='';}});

    document.getElementById('enterBtn').addEventListener('click',function(){document.getElementById('cover').classList.remove('active');document.getElementById('cover').style.display='none';document.getElementById('app').classList.add('visible');document.body.style.overflow='hidden';renderPage(0,1);});
    document.body.style.overflow='hidden';
    })();
    </script>
